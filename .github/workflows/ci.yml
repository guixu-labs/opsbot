name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"

      - name: 安装锁定依赖
        run: uv sync --locked

      - name: 代码风格与静态检查
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run lint-imports --no-cache
          uv run codespell $(git ls-files '*.md')

      - name: 测试
        run: uv run pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"

      - name: 校验发布标签与包版本
        if: github.ref_type == 'tag'
        run: |
          expected_tag="v$(uv version --short)"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "::error::发布标签 $GITHUB_REF_NAME 与包版本对应的 $expected_tag 不一致"
            exit 1
          fi

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: 构建前端
        working-directory: src/workflow_controller/web/frontend
        run: |
          npm ci
          npm run build

      - name: 写入 axcor 发行包依赖
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project python scripts/prepare_release_dependencies.py

      - name: 构建发行包
        run: uv build --no-sources

      - name: 验证仅用发行 wheel 安装
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/release-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/release-bin
        run: |
          uv tool install dist/*.whl
          "$UV_TOOL_BIN_DIR/workflow-controller" --help

      - name: 上传发行包
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          overwrite: true

  install:
    runs-on: ubuntu-latest
    # install.sh 会从公网 clone axcor，git clone 自身无超时，兜底防挂起
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: install.sh 干净环境安装（隔离 HOME）
        env:
          ISOLATED_HOME: ${{ runner.temp }}/isolated-home
        run: |
          mkdir -p "$ISOLATED_HOME"
          HOME="$ISOLATED_HOME" ./install.sh
