    - [GET, "/api/v1/sessions/{session_id}/watchdog/alerts", []]

# SSE 单流推送的事件名全集（web/routes/sse_routes.py）
sse_event_names:
  - claude_event
  - session_update
  - pipeline_update
  - usage_update
  - config_update
  - auth_update
  - handoff_update
  - loop_update
  - server_reload

# watchdog 告警开放词表（按规则名生成 fault.<rule>）
fault_event_types:
  - fault.subagent_timeout
  - fault.file_stall
  - fault.keyword_detected

# 事件行与 payload 的顶层字段
event_payload_fields:
  events_row:
    source: session/events.py（Event.to_dict）
    fields: [id, session_id, iteration, timestamp, event_type, data, run_id, context]
  run_events_row:
    source: store/event_store.py（_row_to_run_event）
    fields: [id, run_id, context, timestamp, event_type, data]
  event_info:
    source: api/event_api.py
    fields: [rowid, session_id, event_type, iteration, timestamp, data, run_id, context]
  session_outcome:
    source: session/events.py（SessionOutcome.to_payload）
    fields: [session_id, kind, stop_reason, last_error, result_digest, iteration, context]
  config_update:
    source: api/config_api.py + web/routes/common.py（段组合）
    fields: [brand_name, project_dir, skills_path, agents_path, hook_server, reviewer, sessions, watchdog, recent_dirs]
    note: 另按已装配领域配置段动态追加键，如 context_bay
  fault_alert:
    source: watchdog/state.py（Alert.to_dict）
    fields: [alert_id, rule, severity, session_id, message, agent_id, agent_type, started_at, elapsed_seconds, threshold_seconds, file_path, stall_count, keyword, timestamp]
