# 控制台自有 HTTP 路由约定清单 —— 约定测试的事实来源，人读文档由本文件生成。
# 内核面端点（/api/v1 下的 91 条）、SSE 事件名与告警词表住 axcor 仓的
# packages/kernel/kernel_tests/contract/manifest.yaml；本清单只登记需要领域包、
# Insight 或前端资源的控制台自有端点。
# 路由行格式：[方法, 路径, [登记状态码]]；登记码为约定测试逐条断言的行为状态码，空表表示未登记。

routes:
  stable: []

  experimental:
    - [POST, "/api/v1/insight/import", []]
    - [GET, "/api/v1/insight/status", []]
    - [POST, "/api/v1/sessions/{session_id}/upload-to-context-bay", []]
    - [GET, "/api/v1/sessions/{session_id}/upload-progress/{task_id}", []]

  internal: []
